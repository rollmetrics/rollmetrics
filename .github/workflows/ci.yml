name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-evals:
    name: Backend Lint, Tests & Knowledge Evals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Install RollMetrics and dev dependencies
        run: |
          uv venv .venv --python 3.12 --clear
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: PII & Deployment Secret Hygiene Gate
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          skip_files = {".github/workflows/ci.yml", "scripts/export_public_oss_repo.sh"}
          patterns = [
              ("personal-email", re.compile(r"korymath" + r"@gmail\.com", re.I)),
              ("gcp-project-number", re.compile(r"83719080" + r"4774")),
              ("gcp-billing-id", re.compile(r"(018CC6-28519" + r"7|01459F-000A4" + r"8)")),
              ("oauth-client-id", re.compile(r"4910799780" + r"0-1ku6csls")),
              ("cloud-run-hash", re.compile(r"cyey7gz" + r"fsq")),
              ("google-api-key", re.compile(r"AIza[0-9A-Za-z_-]{30,}")),
              ("google-oauth-secret", re.compile(r"GOCSPX-[0-9A-Za-z_-]{20,}")),
          ]
          hits = []
          for rel in tracked:
              if rel in skip_files or rel.endswith((".sqlite", ".png", ".jpg", ".jpeg", ".mp4", ".mov")):
                  continue
              try:
                  text = open(rel, encoding="utf-8").read()
              except Exception:
                  continue
              for label, rx in patterns:
                  if rx.search(text):
                      hits.append(f"{label}: {rel}")
          if hits:
              print("PII/secret hygiene gate FAILED:\n" + "\n".join(hits))
              sys.exit(1)
          print("PII/secret hygiene gate PASSED.")
          PY

      - name: Lint backend with Ruff
        run: .venv/bin/ruff check backend

      - name: Run unit and integration test suite with coverage
        env:
          ROLLMETRICS_ENVIRONMENT: test
          ROLLMETRICS_ALLOW_LOCAL_DEV_BYPASS: "true"
        run: .venv/bin/pytest -v --junitxml=junit-backend.xml --cov=rollmetrics --cov-report=term-missing --cov-report=json:coverage-backend.json --cov-fail-under=99

      - name: Publish backend coverage summary
        if: always() && hashFiles('coverage-backend.json') != ''
        run: |
          python3 - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          cov = json.load(open("coverage-backend.json", encoding="utf-8"))
          totals = cov.get("totals", {})
          stmts = int(totals.get("num_statements", 0))
          missed = int(totals.get("missing_lines", 0))
          pct = float(totals.get("percent_covered", 0.0))
          tests_label = "n/a"
          if os.path.exists("junit-backend.xml"):
              root = ET.parse("junit-backend.xml").getroot()
              suite = root.find("testsuite") if root.tag == "testsuites" else root
              if suite is not None:
                  total = int(suite.attrib.get("tests", 0))
                  failed = int(suite.attrib.get("failures", 0)) + int(suite.attrib.get("errors", 0))
                  tests_label = f"{total - failed}/{total} passed"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("### Backend Coverage Summary\n\n")
              fh.write("| Statements | Missed | Coverage % | Tests |\n")
              fh.write("| ---: | ---: | ---: | :--- |\n")
              fh.write(f"| {stmts} | {missed} | {pct:.2f}% | {tests_label} |\n\n")
          PY

      - name: Audit bundled landing media contract
        run: .venv/bin/python scripts/audit_media_contracts.py --file frontend/public/landing-preview.mp4

      - name: Run critical-module branch coverage check
        env:
          ROLLMETRICS_ENVIRONMENT: test
          ROLLMETRICS_ALLOW_LOCAL_DEV_BYPASS: "true"
        run: |
          .venv/bin/pytest -q \
            --cov=rollmetrics.auth \
            --cov=rollmetrics.storage \
            --cov=rollmetrics.video.live_session \
            --cov=rollmetrics.rules.state_machine \
            --cov=rollmetrics.rules.adcc \
            --cov-branch \
            --cov-report=json:coverage-critical-branch.json \
            backend/tests/test_critical_branches.py \
            backend/tests/test_rules_and_video.py \
            backend/tests/test_v03_storage_and_adcc.py \
            backend/tests/test_backend_100_core.py
          python3 - <<'PY'
          import json, os
          cov = json.load(open("coverage-critical-branch.json", encoding="utf-8"))
          totals = cov.get("totals", {})
          total_b = int(totals.get("num_branches", 0))
          cov_b = int(totals.get("covered_branches", 0))
          pct = (100.0 * cov_b / total_b) if total_b else 100.0
          print(f"Critical-module branch coverage: {cov_b}/{total_b} ({pct:.2f}%)")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("### Critical-Module Branch Coverage\n\n")
              fh.write("| Scope | Branches | Covered | Branch % |\n")
              fh.write("| :--- | ---: | ---: | ---: |\n")
              fh.write(f"| `auth`, `storage`, `live_session`, `state_machine`, `adcc` | {total_b} | {cov_b} | {pct:.2f}% |\n\n")
          PY

      - name: Run Knowledge Base v0.1.0 benchmark suite
        env:
          ROLLMETRICS_ENVIRONMENT: test
        run: .venv/bin/rollmetrics eval --version v0.1.0

      - name: Run Scoreboard-Grounded Video Benchmark (rollmetrics-scoreboard-v1 subset)
        env:
          ROLLMETRICS_ENVIRONMENT: test
        run: .venv/bin/rollmetrics eval scoreboard --split calibration --max-matches 10 --models ollama/gemma4:e2b-it-q4_K_M

  frontend-and-docker:
    name: Frontend Build & Multi-Stage Docker Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies, run Vitest coverage suite, and build SPA
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage
          npm run build
          test -f dist/index.html

      - name: Build multi-stage Docker image
        run: docker build -t rollmetrics:ci .

      - name: Container health, auth-gate, and Playwright E2E smoke test
        run: |
          docker run -d --name rollmetrics-ci \
            -p 8080:8080 \
            -e ROLLMETRICS_ENVIRONMENT=cloud \
            -e ROLLMETRICS_ALLOW_LOCAL_DEV_BYPASS=false \
            -e ROLLMETRICS_ALLOWLIST_EMAILS=admin@example.com \
            rollmetrics:ci
          trap 'docker rm -f rollmetrics-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              curl -fsS http://127.0.0.1:8080/healthz
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/system/status)
          echo "Unauthenticated /api/system/status HTTP code: ${STATUS_CODE}"
          if [ "${STATUS_CODE}" != "401" ] && [ "${STATUS_CODE}" != "403" ]; then
            echo "Expected 401 or 403 in cloud mode, got ${STATUS_CODE}"
            docker logs rollmetrics-ci
            exit 1
          fi
          npm --prefix frontend install --no-save playwright
          npx --prefix frontend playwright install chromium --with-deps
          ROLLMETRICS_E2E_URL=http://127.0.0.1:8080 npm --prefix frontend run test:e2e

      - name: Upload Playwright E2E failure screenshots
        if: failure() && hashFiles('frontend/test-results/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-failures
          path: frontend/test-results/
          retention-days: 7

      - name: Publish frontend coverage and Docker smoke summary
        if: always() && hashFiles('frontend/coverage/coverage-summary.json') != ''
        run: |
          python3 - <<'PY'
          import json, os
          summary = json.load(open("frontend/coverage/coverage-summary.json", encoding="utf-8")).get("total", {})
          def fmt(key):
              item = summary.get(key, {})
              return f"{float(item.get('pct', 0.0)):.2f}% ({item.get('covered', 0)}/{item.get('total', 0)})"
          smoke_status = "PASSED" if os.environ.get("JOB_STATUS", "success") == "success" else "FAILED"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("### Frontend Coverage & Docker Smoke Summary\n\n")
              fh.write("| Statements | Branches | Functions | Lines | Docker Smoke |\n")
              fh.write("| :--- | :--- | :--- | :--- | :--- |\n")
              fh.write(f"| {fmt('statements')} | {fmt('branches')} | {fmt('functions')} | {fmt('lines')} | {smoke_status} |\n\n")
          PY
        env:
          JOB_STATUS: ${{ job.status }}
