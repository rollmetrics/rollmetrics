[project]
name = "rollmetrics"
version = "0.1.0"
description = "Live & pre-recorded BJJ IBJJF refereeing, scoring, and Caio Terra Association (CTA) curriculum coaching platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "google-genai>=2.30.1",
    "google-auth>=2.35.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "numpy>=2.0.0",
    "pypdf>=5.0.0",
    "pillow>=11.0.0",
    "yt-dlp>=2025.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
rollmetrics = "rollmetrics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/rollmetrics"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 108
target-version = "py311"
